services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    environment: &app-env
      APP_KEY: base64:unu4s82yn9qVhO51gWUwk7reDRTxGfEKtKv8xf8nbOY=
      APP_NAME: CareerGuide
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8082
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: career_guidance
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - career_guidance

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - app_storage:/var/www/html/storage:ro
    depends_on:
      - app
    networks:
      - career_guidance

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: career_guidance
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - career_guidance

volumes:
  mysql_data:
  app_storage:

networks:
  career_guidance:
    driver: bridge
