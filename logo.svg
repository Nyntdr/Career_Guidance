<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Compass/Navigation Base (outer ring) -->
  <g id="compass">
    <!-- Cardinal points -->
    <circle cx="100" cy="100" r="70" fill="none" stroke="#dbeafe" stroke-width="1" stroke-dasharray="2,3"/>
    
    <!-- North point (top arrow) -->
    <polygon points="100,35 106,50 94,50" fill="url(#blueGradient)"/>
    
    <!-- East point (right) -->
    <polygon points="165,100 150,106 150,94" fill="url(#purpleGradient)"/>
    
    <!-- South point (bottom) -->
    <polygon points="100,165 106,150 94,150" fill="#60a5fa"/>
    
    <!-- West point (left) -->
    <polygon points="35,100 50,106 50,94" fill="#a78bfa"/>
  </g>
  
  <!-- Central AI Brain/Head (circuit pattern) -->
  <g id="ai-brain">
    <!-- Brain shape outline -->
    <ellipse cx="100" cy="95" rx="35" ry="40" fill="url(#blueGradient)" opacity="0.1" stroke="url(#blueGradient)" stroke-width="2"/>
    
    <!-- Circuit nodes -->
    <circle cx="85" cy="75" r="5" fill="url(#blueGradient)"/>
    <circle cx="115" cy="75" r="5" fill="url(#purpleGradient)"/>
    <circle cx="100" cy="95" r="6" fill="url(#blueGradient)"/>
    <circle cx="75" cy="110" r="5" fill="url(#purpleGradient)"/>
    <circle cx="125" cy="110" r="5" fill="url(#blueGradient)"/>
    
    <!-- Circuit lines connecting nodes -->
    <line x1="85" y1="75" x2="100" y2="95" stroke="url(#blueGradient)" stroke-width="2" opacity="0.7"/>
    <line x1="115" y1="75" x2="100" y2="95" stroke="url(#purpleGradient)" stroke-width="2" opacity="0.7"/>
    <line x1="100" y1="95" x2="75" y2="110" stroke="url(#purpleGradient)" stroke-width="2" opacity="0.7"/>
    <line x1="100" y1="95" x2="125" y2="110" stroke="url(#blueGradient)" stroke-width="2" opacity="0.7"/>
    <line x1="75" y1="110" x2="125" y2="110" stroke="url(#blueGradient)" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Growth arrow (upward trend) -->
  <g id="growth-arrow">
    <path d="M 100 140 L 130 110 L 120 110 L 120 135" 
          fill="none" stroke="url(#purpleGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <polygon points="130,110 135,120 125,118" fill="url(#purpleGradient)"/>
  </g>
  
  <!-- Graduation cap accent (small, top right) -->
  <g id="cap-accent">
    <rect x="138" y="55" width="18" height="12" rx="1" fill="url(#blueGradient)" opacity="0.8"/>
    <circle cx="147" cy="53" r="3" fill="url(#blueGradient)"/>
    <line x1="147" y1="56" x2="147" y2="62" stroke="url(#blueGradient)" stroke-width="1.5"/>
  </g>
  
  <!-- Decorative sparkles (representing AI intelligence) -->
  <g id="sparkles" opacity="0.6">
    <circle cx="60" cy="60" r="2" fill="#3b82f6"/>
    <circle cx="140" cy="140" r="2" fill="#8b5cf6"/>
    <circle cx="150" cy="65" r="1.5" fill="#60a5fa"/>
  </g>
</svg>